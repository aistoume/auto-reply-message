        fill="#71717A"/>

  <!-- 替你回的：右下，琥珀、大 -->
  <path d="M99 57 h-43 a10 10 0 0 0 -10 10 v20 a10 10 0 0 0 10 10 h27 l14 11 v-11 a10 10 0 0 0 10 -10 v-20 a10 10 0 0 0 -10 -10 z"
        fill="url(#amber)"/>

  <!-- AI 星芒 -->
  <path d="M72 63 L76 75 L88 79 L76 83 L72 95 L68 83 L56 79 L68 75 Z" fill="#18181B"/>
</svg>
